[project]
name = "very-old-portfolio-site"
version = "1.0.0"
description = "Travis Fischer's 2013 portfolio site (Django)."
requires-python = ">=3.12,<3.13"
dependencies = ["django>=5.2,<6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings"
pythonpath = ["server"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["server"]
extend-exclude = ["deploy"]
